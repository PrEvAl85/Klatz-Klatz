name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Run this from the tag you want to release: the tag is taken from the ref
    # the workflow was started on.
    inputs:
      all_platforms:
        description: "Also build macOS and Linux, not only Windows"
        type: boolean
        default: false

jobs:
  # Decides what to build before any runner is claimed.
  #
  # A tagged push builds the Windows installer only: automatic switching, the
  # headline of this release, works on Windows alone. Building the rest is one
  # checkbox on a manual run, from the same tag.
  plan:
    name: Choose the targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      note: ${{ steps.plan.outputs.note }}
    steps:
      - id: plan
        env:
          ALL_PLATFORMS: ${{ inputs.all_platforms }}
        run: |
          WINDOWS='[{"platform":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
          ALL='[
            {"platform":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"platform":"macos-latest","target":"aarch64-apple-darwin"},
            {"platform":"macos-latest","target":"x86_64-apple-darwin"},
            {"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}
          ]'

          if [ "$ALL_PLATFORMS" = "true" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
            echo "note=Сборки для всех поддерживаемых платформ: Windows, macOS и Linux." >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$WINDOWS" >> "$GITHUB_OUTPUT"
            echo "note=Сборка только для Windows; macOS и Linux в этом релизе не собираются." >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.platform }}
    needs: plan
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # Builds the bundle for this runner's platform and uploads it as a draft
      # release. Runners cannot produce foreign bundles, hence the matrix.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Klatz-Klatz ${{ github.ref_name }}
          releaseBody: |
            Готовые сборки Klatz-Klatz — переключателя раскладки клавиатуры.
            / Ready builds of Klatz-Klatz, the keyboard layout switcher.

            ${{ needs.plan.outputs.note }}
            / ${{ needs.plan.outputs.note }}

            Скачайте нужный файл / Pick your file:
            * Windows — `*_setup.exe` или `.msi`
            * Linux — `.deb` или `.AppImage` (только X11, Wayland не поддерживается / X11 only)
            * macOS — `.dmg`

            Приложение работает полностью офлайн: без аккаунта, телеметрии и автообновлений.
            / Fully offline: no account, no telemetry, no auto-updates.

            Ограничения платформ и сборка из исходников — в README.
            / Platform limitations and building from source — see README.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}