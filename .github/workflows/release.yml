name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      # Builds the bundle for this runner's platform and uploads it as a draft
      # release. Runners cannot produce foreign bundles, hence the matrix.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Klatz-Klatz ${{ github.ref_name }}
          releaseBody: |
            Готовые сборки Klatz-Klatz — переключателя раскладки клавиатуры.
            / Ready builds of Klatz-Klatz, the keyboard layout switcher.

            Скачайте нужный файл / Pick your file:
            * Windows — `*_setup.exe` или `.msi`
            * Linux — `.deb` или `.AppImage` (только X11, Wayland не поддерживается / X11 only)
            * macOS — `.dmg`

            Приложение работает полностью офлайн: без аккаунта, телеметрии и автообновлений.
            / Fully offline: no account, no telemetry, no auto-updates.

            Ограничения платформ и сборка из исходников — в README.
            / Platform limitations and building from source — see README.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}