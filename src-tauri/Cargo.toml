[package]
name = "klatz-klatz"
version = "0.2.0"
description = "Cross-platform keyboard layout switcher in the system tray"
authors = ["Klatz-Klatz contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/klatz-klatz/klatz-klatz"
keywords = ["keyboard", "layout", "switcher", "tray", "tauri"]
categories = ["utility"]

[lib]
# The `_lib` suffix keeps the library name unique and avoids clashing with the
# binary name on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "klatz_klatz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Windows backend declares the six Win32 calls it needs directly, see
# `src/platform/windows.rs`. That keeps the dependency tree free of a crate
# that renames its feature flags between minor releases.

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
